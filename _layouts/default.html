<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="/feed.xml">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <nav aria-label="Site">
      <a class="wordmark" href="/">Chris Owyang</a>
      <ul>
        <li><a href="/writing/" {% if page.url contains '/writing' %}aria-current="page"{% endif %}>Writing</a></li>
        <li><a href="/about" {% if page.url == '/about' %}aria-current="page"{% endif %}>About</a></li>
        <li><a href="/#contact">Say hi</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>{% if site.linkedin %} ·
      <a href="{{ site.linkedin }}">LinkedIn</a>{% endif %}
    </p>
    <p class="colophon">
      Made by hand. Set in Newsreader and Charter; the purple is borrowed
      from Williams College, where the story starts.
    </p>
  </footer>

  <script src="/assets/js/throughline.js" defer></script>
</body>
</html>
