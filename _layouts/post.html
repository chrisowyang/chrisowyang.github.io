---
layout: default
---
<article class="page prose">
  <header class="page-header">
    <p class="meta">
      <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %Y" }}</time>
      {%- if page.draft %} · <span class="draft-tag">working notes</span>{% endif %}
    </p>
    <h1>{{ page.title }}</h1>
    {% if page.dek %}<p class="dek">{{ page.dek }}</p>{% endif %}
  </header>
  {{ content }}
  <p class="post-outro">
    Thoughts, disagreements, better examples? <a href="mailto:{{ site.email }}">Email me</a> —
    the best ones start with a specific question.
  </p>
</article>
