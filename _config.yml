# Site settings
title: Chris Owyang
description: >-
  Product leader. Currently shipping subscriptions at Uber.
  Previously taught machines to recommend music.
url: "https://owyang.xyz"
author:
  name: Chris Owyang
  email: owyangwms@gmail.com

# Contact
email: owyangwms@gmail.com
# TODO(chris): confirm LinkedIn URL, then uncomment and it will appear in the Contact section.
# linkedin: "https://www.linkedin.com/in/TODO"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:title
plugins: [jekyll-sitemap, jekyll-feed, jekyll-seo-tag]

collections:
  writing:
    output: true
    permalink: /writing/:slug

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-card.png
  - scope:
      path: ""
      type: writing
    values:
      layout: post

feed:
  collections: [writing]

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
